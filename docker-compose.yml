# Local development infrastructure for the backend: spins up the Postgres
# database (used via Prisma, see backend/prisma/schema.prisma) and the
# Redis instance (used for BullMQ queues and rate limiting, see
# backend/src/db/redis.ts) that the backend's DATABASE_URL/REDIS_URL env
# vars are expected to point at. Run with `docker compose up -d`.
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      # Named volume so queued/rate-limit data survives container restarts.
      - redis_data:/data
    # --appendonly yes enables AOF persistence so Redis can recover its
    # state (e.g. in-flight rate limit counters) after a restart.
    command: redis-server --appendonly yes
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    ports:
      - '5432:5432'
    environment:
      # NOTE: these credentials are for local development only — never used
      # in production, where DATABASE_URL points at a managed Postgres instance.
      POSTGRES_DB: reachinbox
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  pg_data:
