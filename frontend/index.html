<!--
  Single HTML page that hosts the entire React app (a "single-page app").
  Vite injects/serves this as the app shell; the actual UI is built up by
  frontend/src/main.tsx mounting into the empty #root div below.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <!-- React takes over this element and renders the whole app inside it -->
    <div id="root"></div>
    <!-- Vite's dev server / build process handles this module script,
         resolving and bundling all of main.tsx's imports -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
